<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">SquadMetric — Smarter FPL Decisions</title>
  <desc id="description">Animated SquadMetric banner showing a rising expected-points chart and live FPL decision signals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071225"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#3b176f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#57d68d"/>
      <stop offset="0.5" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#9b7cff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chartClip"><rect x="720" y="82" width="390" height="244" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="40" r="250" fill="url(#glow)">
    <animate attributeName="r" values="220;280;220" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="410" r="190" fill="#16a34a" opacity="0.08">
    <animate attributeName="cx" values="120;175;120" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.12" stroke="#dbeafe">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/>
  </g>

  <g transform="translate(70 67)">
    <rect width="74" height="74" rx="20" fill="url(#accent)"/>
    <path d="M18 52V39l10-9 9 7 18-19" fill="none" stroke="#061221" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 18h8v8" fill="none" stroke="#061221" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="17" y="55" width="40" height="4" rx="2" fill="#061221"/>
  </g>

  <text x="166" y="109" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-2">SquadMetric</text>
  <text x="73" y="181" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="650">Smarter FPL decisions.</text>
  <text x="73" y="221" fill="#a7f3d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="650">Every gameweek.</text>
  <text x="73" y="267" fill="#a9b7d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Transfers · captaincy · chips · bench · fixture horizons</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="73" y="307" width="142" height="40" rx="20" fill="#57d68d" fill-opacity="0.13" stroke="#57d68d" stroke-opacity="0.45"/>
    <circle cx="96" cy="327" r="6" fill="#57d68d">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="111" y="332" fill="#bbf7d0">LIVE DATA</text>
    <rect x="227" y="307" width="171" height="40" rx="20" fill="#8b5cf6" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="250" y="332" fill="#ddd6fe">POINTS-FIRST AI</text>
    <rect x="410" y="307" width="174" height="40" rx="20" fill="#38bdf8" fill-opacity="0.11" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <text x="433" y="332" fill="#bae6fd">NO AUTO-ACTIONS</text>
  </g>

  <g clip-path="url(#chartClip)">
    <rect x="720" y="82" width="390" height="244" rx="22" fill="#081426" fill-opacity="0.82" stroke="#94a3b8" stroke-opacity="0.2"/>
    <g stroke="#94a3b8" stroke-opacity="0.14">
      <path d="M748 128H1082M748 178H1082M748 228H1082M748 278H1082"/>
      <path d="M790 105V300M860 105V300M930 105V300M1000 105V300M1070 105V300"/>
    </g>
    <path d="M748 278 C790 267 805 246 838 250 S896 219 924 225 S972 183 1005 194 S1044 135 1082 126 L1082 304 L748 304Z" fill="url(#area)"/>
    <path d="M748 278 C790 267 805 246 838 250 S896 219 924 225 S972 183 1005 194 S1044 135 1082 126" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)" stroke-dasharray="470" stroke-dashoffset="470">
      <animate attributeName="stroke-dashoffset" values="470;0;0" keyTimes="0;0.65;1" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <g fill="#6ee7b7" filter="url(#softGlow)">
      <circle cx="838" cy="250" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="924" cy="225" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="1005" cy="194" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="1082" cy="126" r="6"><animate attributeName="r" values="5;10;5" dur="2.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="746" y="118" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">EXPECTED POINTS HORIZON</text>
  <g transform="translate(912 344)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="198" height="42" rx="21" fill="#57d68d" fill-opacity="0.14" stroke="#57d68d" stroke-opacity="0.42"/>
    <circle cx="23" cy="21" r="6" fill="#57d68d">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="39" y="26" fill="#bbf7d0" font-size="14" font-weight="750">DECISION READY</text>
  </g>
</svg>
